name: Add progress entry

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  add-progress:
    if: contains(github.event.issue.labels.*.name, 'progress-entry')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse issue and update JSON
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const body = context.payload.issue.body || '';

            function extractField(label) {
              const regex = new RegExp(`### ${label}\\n([\\s\\S]*?)(?=\\n### |$)`);
              const match = body.match(regex);
              return match ? match[1].trim() : '';
            }

            const entry = {
              date: extractField('Data'),
              category: extractField('Categoria'),
              type: extractField('Tipo'),
              text: extractField('Descrição')
            };

            if (!entry.date || !entry.category || !entry.type || !entry.text) {
              core.setFailed('Não foi possível extrair todos os campos do formulário.');
              return;
            }

            const jsonPath = path.join(process.cwd(), 'data', 'progress.json');
            const entries = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));
            entries.push(entry);
            entries.sort((a, b) => new Date(a.date) - new Date(b.date));
            fs.writeFileSync(jsonPath, JSON.stringify(entries, null, 2) + '\n');

            core.setOutput('entry', JSON.stringify(entry));

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: add progress entry from issue #${{ github.event.issue.number }}"
          file_pattern: data/progress.json

      - name: Comment and close issue
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: '✅ Progresso registrado com sucesso no **Swartz Progress Panel**.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              state: 'closed'
            });
