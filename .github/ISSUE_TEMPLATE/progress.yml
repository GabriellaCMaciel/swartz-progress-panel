name: Registrar progresso
description: Use este formulário para adicionar um novo aprendizado, entrega, projeto ou conquista ao painel.
title: "[Progresso] "
labels: ["progress-entry"]
body:
  - type: markdown
    attributes:
      value: |
        Preencha os campos abaixo. Depois de enviar, a automação atualizará o **Swartz Progress Panel**.

  - type: input
    id: date
    attributes:
      label: Data
      description: "Formato AAAA-MM-DD ou DD/MM/AAAA. Deixe em branco para usar a data de hoje."
      placeholder: 2026-10-09
    validations:
      required: false

  - type: input
    id: category
    attributes:
      label: Categoria
      description: "Ex.: Python, React, EFG, Portfólio, Vivo, 42SP."
      placeholder: Python
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Tipo
      options:
        - Aprendizado
        - Entrega
        - Projeto
        - Conquista
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Descrição
      description: Escreva de forma simples e direta o que você fez, aprendeu ou concluiu.
      placeholder: Aprendi a fazer componentes reutilizáveis no React.
    validations:
      required: true
