name: Add progress entry

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  add-progress:
    # Só roda para issues criadas pelo formulário "Registrar progresso" (título começa com [Progresso])
    # e só se quem abriu for a dona do repositório — assim ninguém mais consegue escrever no seu painel.
    if: >-
      startsWith(github.event.issue.title, '[Progresso]') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse issue and update JSON
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const body = (context.payload.issue.body || '').replace(/\r\n/g, '\n');
            const TYPES = ['Aprendizado', 'Entrega', 'Projeto', 'Conquista'];

            function extractField(label) {
              const regex = new RegExp(`### ${label}\\n([\\s\\S]*?)(?=\\n### |$)`);
              const match = body.match(regex);
              const value = match ? match[1].trim() : '';
              return value === '_No response_' ? '' : value;
            }

            function todayInSaoPaulo() {
              // en-CA formata como AAAA-MM-DD
              return new Intl.DateTimeFormat('en-CA', {
                timeZone: 'America/Sao_Paulo',
                year: 'numeric', month: '2-digit', day: '2-digit'
              }).format(new Date());
            }

            function normalizeDate(raw) {
              if (!raw || raw.toLowerCase() === 'hoje') return todayInSaoPaulo();
              let y, m, d;
              let match = raw.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
              if (match) {
                [, y, m, d] = match;
              } else {
                match = raw.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
                if (!match) return null;
                [, d, m, y] = match;
              }
              y = Number(y); m = Number(m); d = Number(d);
              const check = new Date(Date.UTC(y, m - 1, d));
              const valid = check.getUTCFullYear() === y && check.getUTCMonth() === m - 1 && check.getUTCDate() === d;
              if (!valid) return null;
              return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            }

            async function reject(message) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: `⚠️ Não consegui registrar este progresso: ${message}\n\nAbra um novo formulário com os dados corrigidos.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                state: 'closed'
              });
              core.setOutput('ok', 'false');
            }

            const date = normalizeDate(extractField('Data'));
            const category = extractField('Categoria');
            const type = extractField('Tipo');
            const text = extractField('Descrição');

            if (!date) return reject('a data precisa estar no formato AAAA-MM-DD (ex.: 2026-10-09) ou DD/MM/AAAA. Se deixar em branco, uso a data de hoje.');
            if (!category) return reject('faltou a categoria.');
            if (!TYPES.includes(type)) return reject(`o tipo precisa ser um destes: ${TYPES.join(', ')}.`);
            if (!text) return reject('faltou a descrição.');

            const entry = { date, category, type, text };

            const jsonPath = path.join(process.cwd(), 'data', 'progress.json');
            const entries = JSON.parse(fs.readFileSync(jsonPath, 'utf8'));

            const duplicate = entries.some(e =>
              e.date === entry.date && e.category === entry.category && e.type === entry.type && e.text === entry.text
            );
            if (duplicate) return reject('já existe um registro idêntico no painel.');

            entries.push(entry);
            // Ordena por data (texto AAAA-MM-DD ordena certo); o sort do JS é estável, então a ordem do mesmo dia é mantida
            entries.sort((a, b) => a.date.localeCompare(b.date));
            fs.writeFileSync(jsonPath, JSON.stringify(entries, null, 2) + '\n');

            core.setOutput('ok', 'true');

      - name: Commit changes
        if: steps.parse.outputs.ok == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "feat: add progress entry from issue #${{ github.event.issue.number }}"
          file_pattern: data/progress.json

      - name: Comment and close issue
        if: steps.parse.outputs.ok == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.issue.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              body: '✅ Progresso registrado com sucesso no **Swartz Progress Panel**. O site atualiza em 1 a 2 minutos.'
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              state: 'closed'
            });
